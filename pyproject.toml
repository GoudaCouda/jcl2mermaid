[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jcl2Mermaid"
version = "0.1.0"
authors = [
  { name="Austin", email="austinboos05@gmail.com" },
]
description = "a simple and lightweight cli tool to download and convert a JCL into a Mermaid diagram."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "python-dotenv>=1.0.0"
]

[project.scripts]
jcl2mermaid = "ftp_client:main"

[tool.setuptools.packages.find]
where = ["src"]